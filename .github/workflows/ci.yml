# Screenbolt CI — four verification checks per PATTERN.md
# Runs on every push and pull request to catch violations early

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: apps/web

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check pattern
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run check:pattern

      - name: Run tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm test

      # `next typegen` first: tsc needs the route/layout types Next generates
      # into .next/types (LayoutProps, PageProps), which only exist after a
      # build or an explicit typegen -- CI never builds.
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck
